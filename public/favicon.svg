<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sealBg" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2012"/>
      <stop offset="60%" stop-color="#140f08"/>
      <stop offset="100%" stop-color="#080604"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4cf"/>
      <stop offset="25%" stop-color="#e2ba55"/>
      <stop offset="50%" stop-color="#c19630"/>
      <stop offset="75%" stop-color="#f9e28f"/>
      <stop offset="100%" stop-color="#8a6316"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8e5a7"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8222"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Wax Rim -->
  <circle cx="32" cy="32" r="30" fill="url(#sealBg)" stroke="url(#goldRim)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#goldRim)" stroke-width="0.8" stroke-dasharray="1.5 2" opacity="0.85"/>
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="url(#goldRim)" stroke-width="0.5" opacity="0.6"/>

  <!-- Monogram Initials E & A -->
  <g filter="url(#shadow)">
    <!-- E -->
    <text x="22" y="39" text-anchor="middle" font-family="'Cinzel', 'Italiana', 'Times New Roman', serif" font-size="20" font-weight="bold" fill="url(#goldText)">E</text>
    <!-- & -->
    <text x="32" y="36" text-anchor="middle" font-family="'Parisienne', 'Brush Script MT', cursive" font-size="13" font-style="italic" fill="#ffefa8">&amp;</text>
    <!-- A -->
    <text x="42" y="39" text-anchor="middle" font-family="'Cinzel', 'Italiana', 'Times New Roman', serif" font-size="20" font-weight="bold" fill="url(#goldText)">A</text>
  </g>
</svg>
